name: Validate firmware builder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Run tests
        run: python3 -m unittest discover --start-directory tests --verbose

      - name: Check shell interface
        run: shellcheck scripts/*.sh

      - name: Validate locked inputs
        run: |
          python3 tools/firmware.py validate-lock config/build-lock.json
          python3 tools/firmware.py validate-profile config/rm2100-3.4.config
