name: Build RM2100 Padavan 3.4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Firmware Bundle
        required: true
        default: false
        type: boolean
      release_version:
        description: Release version such as 20260818.1 (required when publishing)
        required: false
        type: string
      cpu_frequency:
        description: MT7621 CPU clock mode
        required: true
        default: bootloader
        type: choice
        options:
          - bootloader
          - "900"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  CPU_FREQUENCY: ${{ inputs.cpu_frequency || 'bootloader' }}

concurrency:
  group: rm2100-3.4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm validation tools
        run: shellcheck --version

      - name: Validate builder
        run: |
          python3 -m unittest discover --start-directory tests --verbose
          shellcheck scripts/*.sh
          python3 tools/firmware.py validate-lock config/build-lock.json
          python3 tools/firmware.py validate-profile config/rm2100-3.4.config

  build:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Dpkg::Lock::Timeout=60 \
            install --yes --no-install-recommends \
            autoconf automake autopoint bison build-essential cmake cpio curl \
            fakeroot flex gawk gettext gperf help2man kmod libgmp3-dev \
            libc-dev-bin libltdl-dev libmpc-dev libmpfr-dev libncurses5 \
            libncurses5-dev libncurses-dev libtool-bin patch pkg-config \
            python3-docutils texinfo unzip vim-common wget xxd zlib1g-dev

      - name: Create protected provisioning files
        env:
          ADMIN_PASSWORD: ${{ secrets.FIRMWARE_ADMIN_PASSWORD }}
          WIFI_PASSWORD: ${{ secrets.FIRMWARE_WIFI_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ "$REPOSITORY_VISIBILITY" == "public" ]]; then
            echo "::warning::Public repositories only produce non-deployable test firmware"
            ADMIN_PASSWORD="Ephemeral-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            WIFI_PASSWORD="Ephemeral-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          elif [[ -z "$ADMIN_PASSWORD" || -z "$WIFI_PASSWORD" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::FIRMWARE_ADMIN_PASSWORD and FIRMWARE_WIFI_PASSWORD secrets are required"
              exit 1
            fi
            ADMIN_PASSWORD="Ephemeral-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            WIFI_PASSWORD="Ephemeral-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          fi
          printf '%s' "$ADMIN_PASSWORD" > "$RUNNER_TEMP/admin-password"
          printf '%s' "$WIFI_PASSWORD" > "$RUNNER_TEMP/wifi-password"

      - name: Build and verify Firmware Bundle
        env:
          ADMIN_PASSWORD_FILE: ${{ runner.temp }}/admin-password
          WIFI_PASSWORD_FILE: ${{ runner.temp }}/wifi-password
          BUILD_ROOT: ${{ runner.temp }}/cleanpadavan-build
          CACHE_DIR: ${{ runner.temp }}/cleanpadavan-cache
          OUTPUT_DIR: ${{ runner.temp }}/firmware-bundle
        run: bash scripts/build-firmware.sh

      - name: Upload verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rm2100-3.4-cpu-${{ env.CPU_FREQUENCY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firmware-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject public credentialed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          [[ "$visibility" != "public" ]] || {
            echo "::error::Provisioned firmware must not be published from a public repository"
            exit 1
          }

      - name: Download verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rm2100-3.4-cpu-${{ env.CPU_FREQUENCY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Reverify release inputs
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          image="$(find dist -maxdepth 1 -type f -name 'RM2100_3.4*.trx' -print -quit)"
          source_commit="$(python3 tools/firmware.py lock-value dist/build-lock.json source.commit)"
          source_epoch="$(python3 tools/firmware.py lock-value dist/build-lock.json source.source_date_epoch)"
          builder_commit="$(python3 -c 'import json; print(json.load(open("dist/manifest.json", encoding="utf-8"))["builder"]["commit"])')"
          python3 tools/firmware.py verify-image "$image" \
            --manifest "$RUNNER_TEMP/reverified-manifest.json" \
            --profile dist/rm2100-3.4.config \
            --source-commit "$source_commit" \
            --builder-commit "$builder_commit" \
            --expected-timestamp "$source_epoch"
          cmp dist/manifest.json "$RUNNER_TEMP/reverified-manifest.json"

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.trx

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]{8}\.[0-9]+$ ]] || {
            echo "::error::release_version must match YYYYMMDD.N"
            exit 1
          }
          tag="rm2100-3.4-cpu-$CPU_FREQUENCY-$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release already exists: $tag"
            exit 1
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "RM2100 Padavan 3.4 CPU $CPU_FREQUENCY $RELEASE_VERSION" \
            --notes "Provisioned RM2100 Linux 3.4 Firmware Bundle using CPU mode $CPU_FREQUENCY. Verify SHA256SUMS and GitHub artifact attestation before deployment."
